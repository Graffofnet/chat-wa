<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Style Chat</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }

    .wa-chat-container {
        width: 400px; height: 640px;
        background-color: #efeae2;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        display: flex; flex-direction: column;
        overflow: hidden; position: relative;
    }

    /* ========== ШАПКА (отступы по сторонам 10px) ========== */
    .wa-header {
        background-color: #075e54; color: #fff;
        padding: 8px 10px;
        display: flex; align-items: center; justify-content: space-between;
        gap: 10px; z-index: 10;
    }
    .room-info { display: flex; flex-direction: column; min-width: 0; }
    .room-line { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; }
    .room-id {
        background: none; border: none; color: #d9fdd3;
        font-size: 13px; font-weight: 600; cursor: pointer;
        text-decoration: underline dotted;
        max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        padding: 0;
    }
    .room-id:hover { color: #fff; }
    .my-id { font-size: 10px; opacity: .75; margin-top: 2px; }

    .header-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
        width: 36px; height: 36px; border-radius: 50%;
        border: none; cursor: pointer;
        background: rgba(255,255,255,.16);
        display: flex; align-items: center; justify-content: center;
        transition: background .2s, transform .15s;
    }
    .icon-btn svg { width: 20px; height: 20px; fill: #fff; pointer-events: none; }
    .icon-btn:hover { background: rgba(255,255,255,.3); transform: rotate(15deg); }

    .new-chat-btn {
        width: 40px; height: 40px; flex-shrink: 0;
        background: none; border: none; padding: 0;
        cursor: pointer; border-radius: 9px; overflow: hidden;
        transition: transform .15s;
        display: flex; align-items: center; justify-content: center;
        font-size: 24px;
    }
    .new-chat-btn img { width: 100%; height: 100%; display: block; }
    .new-chat-btn:hover { transform: scale(1.08); }
    .new-chat-btn:active { transform: scale(.95); }

    /* ========== ЛЕНТА СООБЩЕНИЙ ========== */
    .wa-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }

    .message-bubble {
        max-width: 75%; padding: 8px 12px; border-radius: 8px;
        position: relative; word-wrap: break-word;
        box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        transition: opacity .25s ease, transform .25s ease;
    }
    .message-bubble.incoming { align-self: flex-start; background: #fff; border-top-left-radius: 0; }
    .message-bubble.outgoing { align-self: flex-end; background: #dcf8c6; border-top-right-radius: 0; }
    .message-bubble.deleting { opacity: 0; transform: scale(.8); }

    /* Кнопка удаления (только свои) */
    .delete-btn {
        position: absolute; top: -8px; right: -8px;
        width: 22px; height: 22px; border-radius: 50%;
        background: #ff3b30; color: #fff; border: none;
        font-size: 11px; cursor: pointer; display: none;
        align-items: center; justify-content: center;
        box-shadow: 0 1px 4px rgba(0,0,0,.35); z-index: 5;
    }
    .message-bubble.outgoing:hover .delete-btn { display: flex; }
    @media (hover: none) { .message-bubble.outgoing .delete-btn { display: flex; } }

    /* Кнопка реакций: плоский SVG-смайл в круге, без окантовки */
    .react-btn {
        position: absolute; top: -9px; left: -9px;
        width: 24px; height: 24px; border-radius: 50%;
        background: #ffffff;
        border: none; outline: none;
        box-shadow: 0 1px 4px rgba(0,0,0,.22);
        cursor: pointer; display: none;
        align-items: center; justify-content: center;
        padding: 0; z-index: 5;
        transition: transform .12s;
    }
    .react-btn svg { width: 16px; height: 16px; display: block; pointer-events: none; }
    .react-btn:hover { transform: scale(1.15); }
    .message-bubble:hover .react-btn { display: flex; }
    @media (hover: none) { .message-bubble .react-btn { display: flex; } }

    /* Реакции: круглые SVG-бейджи в нижнем углу пузыря */
    .msg-reactions {
        position: absolute;
        bottom: -11px; right: -7px;              /* входящие: нижний ПРАВЫЙ угол */
        display: flex; gap: 4px; z-index: 6;
    }
    .message-bubble.outgoing .msg-reactions { right: auto; left: -7px; }  /* исходящие: зеркально */
    .msg-reactions:empty { display: none; }

    .reaction-pill {
        position: relative;
        width: 26px; height: 26px; border-radius: 50%;
        border: none; outline: none;
        background: #ffffff;
        box-shadow: 0 1px 3px rgba(0,0,0,.2);
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; padding: 0;
        transition: transform .12s;
    }
    .reaction-pill:hover { transform: scale(1.18); }
    .reaction-pill.mine { background: #d9fdd3; }  /* своя — тон без рамки */
    .reaction-pill svg { width: 18px; height: 18px; display: block; pointer-events: none; }
    .reaction-pill .r-emoji { font-size: 15px; line-height: 1; pointer-events: none; }
    .reaction-pill .rcount {
        position: absolute; top: -6px; right: -7px;
        min-width: 15px; height: 15px; padding: 0 4px;
        border-radius: 8px; background: #25d366; color: #fff;
        font-size: 9px; font-weight: 700;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 1px 2px rgba(0,0,0,.3);
    }

    .system-message {
        align-self: center; background: rgba(255,255,240,.92); color: #555;
        font-size: 11px; padding: 4px 12px; border-radius: 6px;
        box-shadow: 0 1px 1px rgba(0,0,0,.1); text-align: center;
    }
    .wa-messages.theme-dark .system-message { background: rgba(18,28,34,.85); color: #c9d1d6; }

    .message-time { font-size: 10px; color: #999; text-align: right; margin-top: 4px; }

    /* ========== ГОЛОСОВОЙ ПЛЕЕР ========== */
    .voice-player { display: flex; align-items: center; gap: 10px; min-width: 200px; }
    .play-btn {
        width: 32px; height: 32px; border-radius: 50%;
        background: #075e54; color: #fff; border: none; cursor: pointer;
        display: flex; align-items: center; justify-content: center; font-size: 14px;
    }
    .audio-wave { flex: 1; height: 30px; display: flex; align-items: center; gap: 2px; }
    .audio-wave span { display: block; width: 3px; background: #888; border-radius: 2px; }

    /* ========== ПАНЕЛЬ ЗАПИСИ ========== */
    .wa-input-area { background: #f0f0f0; padding: 10px; display: flex; align-items: center; gap: 10px; }
    .record-btn {
        width: 50px; height: 50px; border-radius: 50%;
        border: none; cursor: pointer; position: relative;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(145deg, #45f295 0%, #25d366 45%, #12b76a 100%);
        box-shadow:
            0 4px 16px rgba(37, 211, 102, 0.5),
            inset 0 1px 0 rgba(255, 255, 255, 0.4),
            inset 0 -3px 6px rgba(0, 0, 0, 0.15);
        transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }
    .record-btn svg {
        width: 24px; height: 24px; fill: #fff;
        filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
        transition: transform .18s ease; pointer-events: none;
    }
    .record-btn:hover {
        transform: translateY(-2px) scale(1.06);
        filter: brightness(1.1);
        box-shadow:
            0 7px 22px rgba(37, 211, 102, 0.65),
            inset 0 1px 0 rgba(255, 255, 255, 0.4),
            inset 0 -3px 6px rgba(0, 0, 0, 0.12);
    }
    .record-btn:active { transform: scale(.9); }
    .record-btn.recording {
        background: linear-gradient(145deg, #ff7a6e 0%, #ff3b30 50%, #d92b20 100%);
        box-shadow:
            0 4px 20px rgba(255, 59, 48, 0.6),
            inset 0 1px 0 rgba(255, 255, 255, 0.35),
            inset 0 -3px 6px rgba(0, 0, 0, 0.15);
        animation: pulse 1.5s infinite;
    }
    .record-btn.recording svg { transform: scale(1.08); }
    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(255,59,48,.7); }
        70% { box-shadow: 0 0 0 10px rgba(255,59,48,0); }
        100% { box-shadow: 0 0 0 0 rgba(255,59,48,0); }
    }
    .recording-indicator { display: none; flex: 1; align-items: center; color: #ff3b30; font-size: 14px; font-weight: bold; }
    .recording-indicator.active { display: flex; }
    .rec-timer { margin-left: 10px; color: #333; }
    .status-text { flex: 1; font-size: 13px; color: #666; text-align: center; }

    /* ========== РОТАТОР ФОНА ========== */
    .bg-rotator {
        position: absolute; left: 50%; bottom: 72px;
        transform: translateX(-50%) translateY(12px);
        width: 88%; background: #fff; border-radius: 16px;
        box-shadow: 0 10px 28px rgba(0,0,0,.28);
        padding: 12px; display: flex; align-items: center; gap: 10px;
        opacity: 0; pointer-events: none;
        transition: opacity .25s ease, transform .25s ease;
        z-index: 40;
    }
    .bg-rotator.open { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
    .rot-arrow {
        width: 34px; height: 34px; border-radius: 50%; border: none;
        background: #f0f0f0; color: #555; font-size: 20px; line-height: 1;
        cursor: pointer; flex-shrink: 0; transition: background .2s, color .2s;
    }
    .rot-arrow:hover { background: #25d366; color: #fff; }
    .rot-main { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .rot-preview { width: 72px; height: 72px; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
    .rot-preview.spin { animation: spinIn .45s ease; }
    @keyframes spinIn {
        from { transform: rotate(-180deg) scale(.5); opacity: .3; }
        to   { transform: rotate(0deg)  scale(1);  opacity: 1; }
    }
    .rot-name { font-size: 12px; color: #444; font-weight: 600; }
    .rot-dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .rot-dot {
        width: 22px; height: 22px; border-radius: 50%;
        border: 2px solid transparent; cursor: pointer;
        box-shadow: inset 0 0 0 1px rgba(0,0,0,.18);
        transition: transform .15s, border-color .15s;
    }
    .rot-dot:hover { transform: scale(1.15); }
    .rot-dot.active { border-color: #25d366; transform: scale(1.2); }

    /* ========== ПАНЕЛЬ ВЫБОРА РЕАКЦИЙ ========== */
    .reaction-picker {
        position: fixed; z-index: 100;
        background: #fff; border-radius: 26px;
        box-shadow: 0 8px 26px rgba(0,0,0,.3);
        padding: 6px 10px; display: none;
        align-items: center; gap: 2px;
        max-width: 92vw;
    }
    .reaction-picker.open { display: flex; flex-wrap: wrap; justify-content: center; }
    .rp-emoji {
        background: none; border: none; cursor: pointer;
        font-size: 22px; line-height: 1; padding: 4px;
        transition: transform .12s;
    }
    .rp-emoji:hover { transform: scale(1.3) rotate(-8deg); }
    .rp-more {
        background: #f0f0f0; border: none; border-radius: 50%;
        width: 26px; height: 26px; cursor: pointer;
        font-size: 15px; color: #555; margin-left: 4px; flex-shrink: 0;
    }
    .rp-more:hover { background: #25d366; color: #fff; }
    .rp-grid {
        display: none; width: 100%;
        grid-template-columns: repeat(8, 1fr);
        gap: 2px; margin-top: 6px; padding-top: 6px;
        border-top: 1px solid #eee;
    }
    .reaction-picker.grid-open .rp-grid { display: grid; }

    /* ========== ТОСТ ========== */
    .toast {
        position: absolute; bottom: 75px; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,.78); color: #fff; padding: 8px 16px;
        border-radius: 18px; font-size: 12px; max-width: 90%;
        opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 50;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="wa-chat-container">
    <!-- ШАПКА -->
    <div class="wa-header">
        <div class="room-info">
            <div class="room-line">
                <span>Ваш чат:</span>
                <button class="room-id" id="roomIdBtn" title="Нажмите, чтобы скопировать ID чата">...</button>
            </div>
            <div class="my-id">Ваш ID: <span id="myIdDisplay">...</span></div>
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="bgToggle" title="Сменить фон чата">
                <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            </button>
            <button class="new-chat-btn" id="newChatBtn" title="Создать новый чат">
                <img src="logo.png" alt="Новый чат"
                     onerror="this.remove(); document.getElementById('newChatBtn').textContent='➕';">
            </button>
        </div>
    </div>

    <!-- ЛЕНТА СООБЩЕНИЙ -->
    <div class="wa-messages" id="chatBox"></div>

    <!-- ПАНЕЛЬ ЗАПИСИ -->
    <div class="wa-input-area">
        <div class="recording-indicator" id="recIndicator">
            🔴 Запись... <span class="rec-timer" id="recTimer">00:00</span>
        </div>
        <span class="status-text" id="statusText">Нажмите и удерживайте микрофон</span>
        <button class="record-btn" id="recordBtn" title="Удерживайте для записи">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
        </button>
    </div>

    <!-- РОТАТОР ФОНА -->
    <div class="bg-rotator" id="bgRotator">
        <button class="rot-arrow" id="bgPrev">‹</button>
        <div class="rot-main">
            <div class="rot-preview" id="bgPreview"></div>
            <div class="rot-name" id="bgName">...</div>
            <div class="rot-dots" id="bgDots"></div>
        </div>
        <button class="rot-arrow" id="bgNext">›</button>
    </div>

    <!-- ПАНЕЛЬ РЕАКЦИЙ -->
    <div class="reaction-picker" id="reactionPicker">
        <div class="rp-quick" id="rpQuick" style="display:contents"></div>
        <button class="rp-more" id="rpMore" title="Все смайлы">＋</button>
        <div class="rp-grid" id="rpGrid"></div>
    </div>

    <div class="toast" id="toast"></div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
    // ========== ID ПОЛЬЗОВАТЕЛЯ (кэш) ==========
    function generateUUID() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });
    }
    function getUserId() {
        let userId = localStorage.getItem('wa_chat_user_id');
        if (!userId) {
            userId = generateUUID();
            localStorage.setItem('wa_chat_user_id', userId);
        }
        document.cookie = `chat_uid=${userId}; path=/; max-age=31536000`;
        return userId;
    }
    const myUserId = getUserId();
    document.getElementById('myIdDisplay').innerText = myUserId.substring(0, 8) + '...';

    // ========== ЭЛЕМЕНТЫ ==========
    const socket = io(window.location.origin, { query: { userId: myUserId } });
    const chatBox    = document.getElementById('chatBox');
    const roomIdBtn  = document.getElementById('roomIdBtn');
    const newChatBtn = document.getElementById('newChatBtn');
    const toast      = document.getElementById('toast');

    let currentRoomId = null;

    // ========== ВЕКТОРНЫЕ ИКОНКИ (SVG) ==========
    const SMILEY_SVG = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FFD351"/><circle cx="8.6" cy="10" r="1.6" fill="#5b4423"/><circle cx="15.4" cy="10" r="1.6" fill="#5b4423"/><path d="M7.4 13.8c.8 2.1 2.5 3.4 4.6 3.4s3.8-1.3 4.6-3.4H7.4z" fill="#5b4423"/></svg>`;

    const REACTION_SVG = {
        '❤️': `<svg viewBox="0 0 24 24"><path fill="#e0245e" d="M12 21.3S3.5 16 1.6 11.4C.3 8.2 2.6 4.7 6 4.7c2 0 3.4 1 4.2 2.4L12 9.4l1.8-2.3c.8-1.4 2.2-2.4 4.2-2.4 3.4 0 5.7 3.5 4.4 6.7C20.5 16 12 21.3 12 21.3z"/></svg>`,
        '👍': `<svg viewBox="0 0 24 24"><path fill="#25c065" d="M2 21h4.2V9H2v12zM23 10c0-1.2-.9-2.1-2-2.1h-6.4l1-4.7c.1-.5-.1-1.1-.5-1.5l-1.1-1.1-7.8 7.9c-.3.3-.5.8-.5 1.3V19c0 1.2.9 2.1 2 2.1h9.2c.8 0 1.6-.5 1.9-1.3l3-7.1c.1-.2.2-.5.2-.8V10z"/></svg>`,
        '😂': `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FFD351"/><path d="M6.8 9.5c.9-1.2 2.3-1.2 3.2 0M14 9.5c.9-1.2 2.3-1.2 3.2 0" stroke="#5b4423" stroke-width="1.4" fill="none" stroke-linecap="round"/><path d="M6.5 13c1 3 3 4.6 5.5 4.6s4.5-1.6 5.5-4.6H6.5z" fill="#5b4423"/><path d="M4.6 12.2c-.9.3-1.5 1.2-1.3 2.1.2.9 1.1 1.4 2 1.2-.5-1-.8-2.1-.7-3.3zM19.4 12.2c.9.3 1.5 1.2 1.3 2.1-.2.9-1.1 1.4-2 1.2.5-1 .8-2.1.7-3.3z" fill="#4fc3f7"/></svg>`,
        '😮': `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FFD351"/><circle cx="8.6" cy="9.6" r="1.7" fill="#5b4423"/><circle cx="15.4" cy="9.6" r="1.7" fill="#5b4423"/><ellipse cx="12" cy="16" rx="2.6" ry="3.4" fill="#5b4423"/></svg>`,
        '😢': `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#FFD351"/><circle cx="8.6" cy="10" r="1.6" fill="#5b4423"/><circle cx="15.4" cy="10" r="1.6" fill="#5b4423"/><path d="M8 17.5c1.1-1.4 2.5-2 4-2s2.9.6 4 2" stroke="#5b4423" stroke-width="1.4" fill="none" stroke-linecap="round"/><path d="M6.8 12.5c-.8 1.6-1.2 2.8-1.2 3.7 0 1 .7 1.7 1.6 1.7s1.6-.7 1.6-1.7c0-.9-.4-2.1-1.2-3.7z" fill="#4fc3f7"/></svg>`,
        '🔥': `<svg viewBox="0 0 24 24"><path fill="#ff7043" d="M13.3 1s.9 3 .9 5.5c0 2.4-1.6 4.3-3.9 4.3S6.4 8.9 6.4 6.5v-.6C3.9 8.7 2.2 12.3 2.2 15.6 2.2 20.2 6.6 24 12 24s9.8-3.8 9.8-8.4c0-6.6-4.7-12.1-8.5-14.6z"/><path fill="#ffca28" d="M12 23c-2.8 0-5-2-5-4.6 0-2.7 2.2-4.4 5-7.4 2.8 3 5 4.7 5 7.4 0 2.6-2.2 4.6-5 4.6z"/></svg>`,
    };
    function reactionIcon(emoji) {
        return REACTION_SVG[emoji] || `<span class="r-emoji">${emoji}</span>`;
    }

    // ========== КОМНАТЫ ==========
    function getRoomFromUrl() {
        const q = new URLSearchParams(location.search).get('room');
        if (q) return q;
        if (location.hash.startsWith('#room=')) return location.hash.slice(6);
        return null;
    }
    function joinRoom(roomId) {
        currentRoomId = roomId;
        localStorage.setItem('wa_chat_last_room', roomId);
        history.replaceState(null, '', '?room=' + encodeURIComponent(roomId));
        chatBox.innerHTML = '';
        socket.emit('join_room', roomId);
    }
    socket.on('connect', () => {
        const urlRoom = getRoomFromUrl();
        const saved   = localStorage.getItem('wa_chat_last_room');
        joinRoom(urlRoom || saved || 'general');
    });
    socket.on('room_joined', ({ roomId }) => {
        currentRoomId = roomId;
        updateRoomDisplay();
        addSystemMessage(roomId === 'general' ? 'Вы в общем чате' : 'Вы вошли в чат: ' + roomId);
    });
    socket.on('system_event', ({ text }) => addSystemMessage(text));

    function updateRoomDisplay() {
        roomIdBtn.textContent = currentRoomId === 'general' ? 'Общий' : currentRoomId.slice(0, 8) + '…';
        roomIdBtn.title = 'ID чата: ' + currentRoomId + '\nНажмите, чтобы скопировать';
    }

    // Копирование ID чата
    roomIdBtn.addEventListener('click', async () => {
        const id = currentRoomId;
        try {
            await navigator.clipboard.writeText(id);
            showToast('✅ ID чата скопирован: ' + id);
        } catch (e) {
            const ta = document.createElement('textarea');
            ta.value = id; document.body.appendChild(ta);
            ta.select(); document.execCommand('copy'); ta.remove();
            showToast('✅ ID чата скопирован: ' + id);
        }
    });

    // Создание нового чата
    newChatBtn.addEventListener('click', () => {
        if (!confirm('Создать новый чат?\nСкопируйте его ID и отправьте собеседникам, чтобы пригласить их.')) return;
        joinRoom(generateUUID());
        addSystemMessage('🆕 Новый чат создан. Отправьте ID чата собеседникам для приглашения.');
    });

    // ========== СООБЩЕНИЯ ==========
    socket.on('new_voice_message', (d) => appendMessage(d.senderId, d.audioBase64, false, d.messageId));

    socket.on('message_deleted', ({ messageId }) => {
        const el = document.querySelector(`[data-message-id="${messageId}"]`);
        if (!el) return;
        el.classList.add('deleting');
        setTimeout(() => el.remove(), 250);
    });
    socket.on('delete_denied', ({ reason }) => alert('Не удалось удалить: ' + reason));

    // ========== ЗАПИСЬ ГОЛОСА ==========
    const recordBtn = document.getElementById('recordBtn');
    const recIndicator = document.getElementById('recIndicator');
    const statusText = document.getElementById('statusText');
    const recTimerEl = document.getElementById('recTimer');
    let mediaRecorder, audioChunks = [], isRecording = false, timerInterval, seconds = 0;

    async function initRecorder() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                audioChunks = [];
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = () => {
                    const messageId = generateUUID();
                    socket.emit('send_voice_message', { messageId, audioBase64: reader.result });
                    appendMessage(myUserId, reader.result, true, messageId);
                };
            };
        } catch (e) { alert('Необходимо разрешить доступ к микрофону!'); }
    }
    initRecorder();

    recordBtn.addEventListener('mousedown', startRecording);
    recordBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
    recordBtn.addEventListener('mouseup', stopRecording);
    recordBtn.addEventListener('mouseleave', stopRecording);
    recordBtn.addEventListener('touchend', stopRecording);
    recordBtn.addEventListener('touchcancel', stopRecording);

    function startRecording() {
        if (!mediaRecorder || isRecording) return;
        audioChunks = []; mediaRecorder.start(); isRecording = true;
        recordBtn.classList.add('recording'); recIndicator.classList.add('active');
        statusText.style.display = 'none';
        seconds = 0; updateTimer();
        timerInterval = setInterval(() => { seconds++; updateTimer(); }, 1000);
    }
    function stopRecording() {
        if (!isRecording) return;
        mediaRecorder.stop(); isRecording = false;
        recordBtn.classList.remove('recording'); recIndicator.classList.remove('active');
        statusText.style.display = 'block';
        clearInterval(timerInterval);
    }
    function updateTimer() {
        recTimerEl.innerText =
            String(Math.floor(seconds / 60)).padStart(2, '0') + ':' +
            String(seconds % 60).padStart(2, '0');
    }

    // ========== РЕНДЕР СООБЩЕНИЯ ==========
    function appendMessage(senderId, base64Audio, isOutgoing, messageId) {
        const bubble = document.createElement('div');
        bubble.className = `message-bubble ${isOutgoing ? 'outgoing' : 'incoming'}`;
        if (messageId) bubble.dataset.messageId = messageId;
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        let waveBars = '';
        for (let i = 0; i < 30; i++) waveBars += `<span style="height:${Math.floor(Math.random()*20)+5}px"></span>`;

        bubble.innerHTML = `
            <button class="react-btn" title="Поставить реакцию">${SMILEY_SVG}</button>
            <div class="voice-player">
                <button class="play-btn">▶</button>
                <div class="audio-wave">${waveBars}</div>
                <audio src="${base64Audio}"></audio>
            </div>
            <div class="msg-reactions"></div>
            <div class="message-time">${time} ${isOutgoing ? '✓✓' : ''}</div>`;

        const playBtn = bubble.querySelector('.play-btn');
        const audio = bubble.querySelector('audio');
        playBtn.onclick = () => {
            if (audio.paused) { audio.play(); playBtn.innerText = '⏸'; }
            else { audio.pause(); playBtn.innerText = '▶'; }
        };
        audio.onended = () => playBtn.innerText = '▶';

        bubble.querySelector('.react-btn').onclick = (e) => {
            e.stopPropagation();
            openPicker(e.currentTarget, messageId);
        };
        bubble.ondblclick = () => socket.emit('add_reaction', { messageId, emoji: '❤️' });

        if (isOutgoing) {
            const del = document.createElement('button');
            del.className = 'delete-btn'; del.title = 'Удалить сообщение'; del.innerText = '✕';
            del.onclick = () => {
                if (confirm('Удалить голосовое сообщение?')) {
                    audio.pause();
                    socket.emit('delete_message', { messageId });
                }
            };
            bubble.appendChild(del);
        }
        chatBox.appendChild(bubble);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function addSystemMessage(text) {
        const el = document.createElement('div');
        el.className = 'system-message';
        el.textContent = text;
        chatBox.appendChild(el);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    let toastTimer;
    function showToast(text) {
        toast.textContent = text;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // ========== ФОНЫ ЧАТА (7 штук) ==========
    function doodle(color, opacity) {
        const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90' viewBox='0 0 90 90'>
          <g fill='${color}' fill-opacity='${opacity}'>
            <path d='M18 14h20a6 6 0 0 1 6 6v10a6 6 0 0 1-6 6h-10l-8 7v-7h-2a6 6 0 0 1-6-6V20a6 6 0 0 1 6-6z'/>
            <path d='M63 52c-3.3 0-6 2.7-6 6 0 4.5 6 9.5 6 9.5s6-5 6-9.5c0-3.3-2.7-6-6-6z'/>
            <circle cx='70' cy='20' r='5'/>
            <path d='M20 58l3.2 6.6 7.3 1-5.3 5.1 1.3 7.2-6.5-3.4-6.5 3.4 1.3-7.2-5.3-5.1 7.3-1z'/>
            <circle cx='45' cy='48' r='3'/>
          </g></svg>`;
        return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
    }
    const BACKGROUNDS = [
        { name: 'Классика',    color: '#efeae2', image: doodle('#a89f8d', 0.20) },
        { name: 'Тёмная',      color: '#0b141a', image: doodle('#ffffff', 0.06), dark: true },
        { name: 'Мятная',      color: '#d9f2e6', image: doodle('#0b8f6a', 0.14) },
        { name: 'Океан',       color: '#dceaf2', image: doodle('#2b6f8f', 0.14) },
        { name: 'Закат',       color: '#ffe8dc', image: doodle('#e2704a', 0.16) },
        { name: 'Лаванда',     color: '#eae4f6', image: doodle('#7a5cc0', 0.14) },
        { name: 'Ночной неон', color: '#151b2e', image: doodle('#39e6b0', 0.10), dark: true },
    ];

    const bgRotator = document.getElementById('bgRotator');
    const bgPreview = document.getElementById('bgPreview');
    const bgName    = document.getElementById('bgName');
    const bgDots    = document.getElementById('bgDots');

    document.getElementById('bgToggle').onclick = () => bgRotator.classList.toggle('open');
    document.getElementById('bgPrev').onclick = () => applyBg(bgIndex - 1, true);
    document.getElementById('bgNext').onclick = () => applyBg(bgIndex + 1, true);

    BACKGROUNDS.forEach((bg, i) => {
        const d = document.createElement('button');
        d.className = 'rot-dot';
        d.style.backgroundColor = bg.color;
        d.style.backgroundImage = bg.image;
        d.title = bg.name;
        d.onclick = () => applyBg(i, true);
        bgDots.appendChild(d);
    });

    let bgIndex = parseInt(localStorage.getItem('wa_chat_bg') || '0', 10);
    if (isNaN(bgIndex) || bgIndex < 0 || bgIndex >= BACKGROUNDS.length) bgIndex = 0;

    function applyBg(i, animate) {
        bgIndex = (i + BACKGROUNDS.length) % BACKGROUNDS.length;
        const bg = BACKGROUNDS[bgIndex];
        chatBox.style.backgroundColor = bg.color;
        chatBox.style.backgroundImage = bg.image;
        chatBox.classList.toggle('theme-dark', !!bg.dark);
        localStorage.setItem('wa_chat_bg', bgIndex);
        bgPreview.style.backgroundColor = bg.color;
        bgPreview.style.backgroundImage = bg.image;
        bgName.textContent = bg.name;
        [...bgDots.children].forEach((d, idx) => d.classList.toggle('active', idx === bgIndex));
        if (animate) {
            bgPreview.classList.remove('spin');
            void bgPreview.offsetWidth;
            bgPreview.classList.add('spin');
        }
    }
    applyBg(bgIndex, false);

    // ========== РЕАКЦИИ ==========
    const RP_QUICK = ['👍', '❤️', '😂', '😮', '😢', '🙏'];
    const RP_GRID = [
        '😀','😅','😊','😍','','😘','😜','🤪','🤔','','🥳','','🤯','🥺','😇','🤩',
        '😎','🤝','','🙌','','✌️','🤞','💪','👀','🙈','','🔥','✨','⭐','🎉','',
        '🌹','💐','','🍕','⚽','🎵','✅','❌'
    ];

    const picker = document.getElementById('reactionPicker');
    const rpQuick = document.getElementById('rpQuick');
    const rpGrid  = document.getElementById('rpGrid');
    let reactTargetId = null;

    RP_QUICK.forEach(em => rpQuick.appendChild(makeRpBtn(em)));
    RP_GRID.forEach(em => rpGrid.appendChild(makeRpBtn(em)));

    function makeRpBtn(em) {
        const b = document.createElement('button');
        b.className = 'rp-emoji';
        b.textContent = em;
        b.onclick = (e) => {
            e.stopPropagation();
            socket.emit('add_reaction', { messageId: reactTargetId, emoji: em });
            picker.classList.remove('open', 'grid-open');
        };
        return b;
    }

    document.getElementById('rpMore').onclick = (e) => {
        e.stopPropagation();
        picker.classList.toggle('grid-open');
    };

    function openPicker(btn, messageId) {
        reactTargetId = messageId;
        picker.classList.add('open');
        picker.classList.remove('grid-open');
        const r = btn.getBoundingClientRect();
        const pw = picker.offsetWidth, ph = picker.offsetHeight;
        let left = Math.min(Math.max(8, r.left + r.width / 2 - pw / 2), window.innerWidth - pw - 8);
        let top  = r.top - ph - 10;
        if (top < 8) top = r.bottom + 10;
        picker.style.left = left + 'px';
        picker.style.top  = top + 'px';
    }

    document.addEventListener('click', (e) => {
        if (!picker.contains(e.target) && !e.target.classList.contains('react-btn')) {
            picker.classList.remove('open', 'grid-open');
        }
    });

    socket.on('reaction_update', ({ messageId, reactions }) => {
        const bubble = document.querySelector(`[data-message-id="${messageId}"]`);
        if (!bubble) return;
        const box = bubble.querySelector('.msg-reactions');
        box.innerHTML = '';
        reactions.forEach(r => {
            const mine = r.users.includes(myUserId);
            const pill = document.createElement('button');
            pill.className = 'reaction-pill' + (mine ? ' mine' : '');
            pill.title = mine ? 'Ваша реакция — нажмите, чтобы снять'
                              : 'Реагировали: ' + r.users.length + ' — нажмите, чтобы присоединиться';
            pill.innerHTML = reactionIcon(r.emoji) +
                (r.users.length > 1 ? `<span class="rcount">${r.users.length}</span>` : '');
            pill.onclick = () => socket.emit('add_reaction', { messageId, emoji: r.emoji });
            box.appendChild(pill);
        });
    });
</script>
</body>
</html>
